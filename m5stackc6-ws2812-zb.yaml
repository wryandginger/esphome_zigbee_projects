esphome:
  name: m5stack-nanoc6-lightstrip-zb50
  friendly_name: M5Stack NanoC6 WS2812 (50 LED) ZB

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

output:
  - platform: ledc
    pin: GPIO07
    id: gpio_07

switch:
  - platform: gpio
    pin: GPIO19
    id: gpio_19
    restore_mode: ALWAYS_ON
binary_sensor:
  - platform: gpio
    name: "Button"
    id: m5stack_button
    pin:
      number: GPIO9
      inverted: true
    on_press: 
        - light.turn_on:
            id: ledstrip
            effect: BlueGradient
    on_double_click: 
        - light.turn_on:
            id: ledstrip
            effect: rainbow
    on_multi_click:
    - timing:
        - ON for at most 1s
        - OFF for at most 1s
        - ON for at most 1s
        - OFF for at most 1s
        - ON for at most 1s
        - OFF for at most 1s
      then:
        - light.turn_on:
            id: ledstrip
            effect: RedGradient
    - timing:
        - ON for at least 3s
        - OFF for at least 1s
        - ON for at least 3s
        - OFF for at least 1s
      then:
        - zigbee.reset: zb
    - timing:
        - ON for at least 5s
      then:
        - light.turn_off:
            id: ledstrip

light:
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    pin: GPIO01
    num_leds: 50
    rgb_order: GRB
    rmt_symbols: 48
    name: "LED Strip"
    id: "ledstrip"
    effects:
      - flicker
      - addressable_rainbow:
           speed: 3
           width: 100
      - addressable_twinkle:
          twinkle_probability: 35%
          progress_interval: 6ms
      - addressable_random_twinkle:
          twinkle_probability: 35%
          progress_interval: 6ms
      - addressable_fireworks:
          update_interval: 75ms
          spark_probability: 40%
          use_random_color: true
          fade_out_rate: 74
      - pulse:
          name: "SPulse"
          transition_length: 500ms
          update_interval: 2s
      - strobe:
          name: "Alarm"
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 500ms
            - state: false
              duration: 150ms
            - state: true
              brightness: 100%
              red: 0%
              green: 0%
              blue: 100%
              duration: 500ms
      - addressable_color_wipe:
          name: "BlueGradient"
          colors:
            - red: 0%
              green: 0%
              blue: 100%  
              num_leds: 10
              gradient: true
            - red: 0%
              green: 100%
              blue: 100%   
              num_leds: 10
              gradient: true
            - red: 100%
              green: 0%
              blue: 100%   
              num_leds: 15
              gradient: true
            - red: 0%
              green: 100%
              blue: 100%   
              num_leds: 10
              gradient: true
            - red: 0%
              green: 0%
              blue: 60%   
              num_leds: 2
              gradient: true
          add_led_interval: 250ms
          reverse: true
      - addressable_color_wipe:
          name: "RedGradient"
          colors:
            - red: 100%
              green: 91%
              blue: 0%  
              num_leds: 10
              gradient: true
            - red: 100%
              green: 6%
              blue: 18%   
              num_leds: 10
              gradient: true
            - red: 100%
              green: 63%
              blue: 0%   
              num_leds: 15
              gradient: true
            - red: 100%
              green: 60%
              blue: 18%   
              num_leds: 10
              gradient: true
            - red: 100%
              green: 0%
              blue: 0%   
              num_leds: 2
              gradient: true
          add_led_interval: 250ms
          reverse: true
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO20
    num_leds: 1
    # rmt_channel: 0 ### this stopped working 2025/02
    chipset: WS2812
    rmt_symbols: 48
    id: "button_light"
    name: "Button LED"
    icon: "mdi:led-outline"
    effects:
      - random:
      - flicker:
      - addressable_rainbow:
  - platform: monochromatic
    output: gpio_07
    id: blueled
    name: "Blue LED"
    
external_components:
  - source: github://luar123/zigbee_esphome
    components: [zigbee]
    
globals:
  - id: color_x
    type: float
    restore_value: no
    initial_value: '0'
  - id: color_y
    type: float
    restore_value: no
    initial_value: '0'

zigbee:
  id: "zb"
  router: false
  power_supply: 1
  endpoints:
    - num: 1
      device_type: COLOR_DIMMABLE_LIGHT
      clusters:
        - id: ON_OFF
          attributes:
            - attribute_id: 0
              id: led_strip1
              type: bool
              on_value:
                then:                
                  - light.control:
                      id: ledstrip
                      state: !lambda "return (bool)x;"
        - id: LEVEL
          attributes:
            - attribute_id: 0
              type: UINT8
              value: 255
              on_value:
                then:
                  - light.control:
                      id: ledstrip
                      brightness: !lambda "return ((float)x)/255;"
        - id: COLOR_CONTROL
          attributes:
            - attribute_id: 3
              type: UINT16
              on_value:
                then:
                  - lambda: id(color_x) = (float)x/65536;
                  - light.control:
                      id: ledstrip
                      red: !lambda "return zigbee::get_r_from_xy(id(color_x), id(color_y));"
                      green: !lambda "return zigbee::get_g_from_xy(id(color_x), id(color_y));"
                      blue: !lambda "return zigbee::get_b_from_xy(id(color_x), id(color_y));"
            - attribute_id: 4
              type: UINT16
              on_value:
                then:
                  - lambda: id(color_y) = (float)x/65536;
                  - light.control:
                      id: ledstrip
                      red: !lambda "return zigbee::get_r_from_xy(id(color_x), id(color_y));"
                      green: !lambda "return zigbee::get_g_from_xy(id(color_x), id(color_y));"
                      blue: !lambda "return zigbee::get_b_from_xy(id(color_x), id(color_y));"
        - id: ANALOG_OUTPUT           
          attributes: 
            - attribute_id: 0x001C  
              type: STRING  
              max_length: 6  
              report: false  
              value: Effect  
            - attribute_id: 0x0055  
              type: SINGLE           
              access: READ_WRITE  
              value: 0           
              on_value:  
                  then:  
                    - if:  
                        condition:  
                          - lambda: 'return x == 0;'  
                        then:  
                          - light.turn_off: ledstrip  
                          - zigbee.setAttr:  
                              id: led_strip1  
                              value: !lambda "return false;"  
                        else:  
                          - lambda: |-  
                              static const char* effects[] = {  
                                "None", "rainbow", "twinkle", "RedGradient",  
                                "BlueGradient", "flicker", "fireworks", "SPulse", "Alarm"   
                              };  
                              auto call = id(ledstrip).turn_on();  
                              call.set_effect(effects[(int)x]); 
                              call.perform();  
                          - zigbee.setAttr:  
                              id: led_strip1  
                              value: !lambda "return true;"    
    - num: 2
      device_type: COLOR_DIMMABLE_LIGHT
      clusters:
        - id: ON_OFF
          attributes:
            - attribute_id: 0
              id: button
              type: bool
              on_value:
                then:
                  - light.control:
                      id: button_light
                      state: !lambda "return (bool)x;"
        - id: LEVEL
          attributes:
            - attribute_id: 0
              type: UINT8
              value: 255
              on_value:
                then:
                  - light.control:
                      id: button_light
                      brightness: !lambda "return ((float)x)/255;"
        - id: COLOR_CONTROL
          attributes:
            - attribute_id: 3
              type: UINT16
              on_value:
                then:
                  - lambda: id(color_x) = (float)x/65536;
                  - light.control:
                      id: button_light
                      red: !lambda "return zigbee::get_r_from_xy(id(color_x), id(color_y));"
                      green: !lambda "return zigbee::get_g_from_xy(id(color_x), id(color_y));"
                      blue: !lambda "return zigbee::get_b_from_xy(id(color_x), id(color_y));"
            - attribute_id: 4
              type: UINT16
              on_value:
                then:
                  - lambda: id(color_y) = (float)x/65536;
                  - light.control:
                      id: button_light
                      red: !lambda "return zigbee::get_r_from_xy(id(color_x), id(color_y));"
                      green: !lambda "return zigbee::get_g_from_xy(id(color_x), id(color_y));"
                      blue: !lambda "return zigbee::get_b_from_xy(id(color_x), id(color_y));"   
    - num: 3
      device_type: DIMMABLE_LIGHT
      clusters:
        - id: ON_OFF
          attributes:
            - attribute_id: 0
              type: bool
              on_value:
                then:
                  - light.control:
                      id: blueled
                      state: !lambda "return (bool)x;"
        - id: LEVEL
          attributes:
            - attribute_id: 0
              type: UINT8
              value: 255
              on_value:
                then:
                  - light.control:
                      id: blueled
                      brightness: !lambda "return ((float)x)/255;"      
    
