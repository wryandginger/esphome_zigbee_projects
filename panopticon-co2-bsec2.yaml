# Note: The BSEC2 library is only available for use after accepting its software license agreement. 
# By compiling this configuration, you are explicitly agreeing to the terms of the BSEC license agreement. 
# https://www.bosch-sensortec.com/media/boschsensortec/downloads/software/bme688_development_software/2024_12/20241219_clickthrough_license_terms_bsec_bme680_bme688_bme690.pdf

esphome:
  name: panopticon-co2
  friendly_name: Panopticon CO2

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  framework:
    type: esp-idf

i2c:
  sda: GPIO12
  scl: GPIO13
  scan: false

bme68x_bsec2_i2c:
  address: 0x77
  model: bme680
  operating_age: 28d
  sample_rate: ULP
  supply_voltage: 3.3V

uart:
  - id: motion_bus
    tx_pin: GPIO21
    rx_pin: GPIO22
    baud_rate: 9600
  - id: co2_bus
    tx_pin: GPIO19
    rx_pin: GPIO18
    baud_rate: 9600

ld2410:
  - uart_id: motion_bus
light:
  - platform: esp32_rmt_led_strip
    rgb_order: RGB
    pin: GPIO08
    num_leds: 1
    chipset: WS2812
    rmt_symbols: 48
    id: "led_1"
    name: "Board LED"
    icon: "mdi:led-outline"
    effects:
      - random:
      - flicker:
      - addressable_rainbow:
          
binary_sensor:
  - platform: ld2410
    has_target:
      name: Target
      id: target
      on_press:   
        then:
          - zigbee.setAttr: { id: zb_occupancy, value: 1 }
          - zigbee.reportAttr: "zb_occupancy"
      on_release: 
        then:
          - zigbee.setAttr: { id: zb_occupancy, value: 0 }
          - zigbee.reportAttr: "zb_occupancy"
    has_moving_target:
      name: Moving Target
      id: motion
    has_still_target:
      name: Still Target
      id: starget
  - platform: gpio
    pin:
      number: 9
      mode:
        input: true
        pullup: true
      inverted: true
    id: button_1
    on_press:
      then:
        - zigbee.report: zb
    on_click:
      min_length: 5s
      max_length: 20s
      then:
        - zigbee.reset: zb
sensor:
  - platform: template
    name: Temperature_F
    id: temperature_f
    lambda: return id(temperature).state * 9/5+32;
    accuracy_decimals: 2
    filters:
        - round: 0
        - throttle: 120s

  - platform: bme68x_bsec2
    temperature:
      name: "BME680 Temperature"
      id: temperature
      accuracy_decimals: 2
      filters:
        - round: 0
        - throttle: 120s
    pressure:
      name: "BME680 Pressure"
      id: pressure
      accuracy_decimals: 2
      filters:
        - round: 0
        - throttle: 120s
    humidity:
      name: "BME680 Humidity"
      id: humidity
      accuracy_decimals: 2
      filters:
        - round: 0
        - throttle: 120s
    gas_resistance:
      name: "BME680 Gas Resistance"
      id: gasresist
      accuracy_decimals: 2
      filters:
        - round: 0
        - throttle: 120s
    iaq:
      name: "BME680 IAQ"
      id: iaq
      accuracy_decimals: 2
      filters:
        - round: 0
        - throttle: 120s
    iaq_accuracy: 
      name: "BME680 IAQ Accuracy"
      id: iaqa
      accuracy_decimals: 2
      filters:
        - round: 0
        - throttle: 120s

  - platform: mhz19
    id: mhz19s
    uart_id: co2_bus
    co2:
      name: MH-Z19 CO2 Value
      id: co2
    temperature:
      name: MH-Z19 Temperature
      id: temp2
      accuracy_decimals: 2
      filters:
        - round: 0
        - throttle: 120s

  - platform: ld2410
    light:
      name: light
      id: ldlux
      accuracy_decimals: 2
      filters:
        - round: 0
        - throttle: 120s
    moving_distance:
      name: Moving Distance
      id: mdistance 
    still_distance:
      name: Still Distance
      id: sdistance 
    moving_energy:
      name: Move Energy
      id: menergy
    still_energy:
      name: Still Energy
      id: senergy
    detection_distance:
      name: Detection Distance
      id: ddistance
      accuracy_decimals: 0
      filters:
        - round: 0
        - throttle: 30s
switch:
  - platform: ld2410
    engineering_mode:
      name: "engineering mode"
      id: emode
      restore_mode: RESTORE_DEFAULT_OFF
    bluetooth:
      name: "control bluetooth"
      id: bmode
      restore_mode: RESTORE_DEFAULT_OFF

text_sensor:
  - platform: bme68x_bsec2
    iaq_accuracy:
      name: "BME68x IAQ Accuracy"
      id: accuracy
  - platform: template
    id: quality
    name: "BME68x IAQ Classification"
    lambda: |-
      if ( int(id(iaq).state) <= 50) {
        return {"Excellent"};
      }
      else if (int(id(iaq).state) >= 51 && int(id(iaq).state) <= 100) {
        return {"Good"};
      }
      else if (int(id(iaq).state) >= 101 && int(id(iaq).state) <= 150) {
        return {"OK"};
      }
      else if (int(id(iaq).state) >= 151 && int(id(iaq).state) <= 200) {
        return {"Fair"};
      }
      else if (int(id(iaq).state) >= 201 && int(id(iaq).state) <= 250) {
        return {"Poor"};
      }
      else if (int(id(iaq).state) >= 251 && int(id(iaq).state) <= 350) {
        return {"Bad"};
      }
      else if (int(id(iaq).state) >= 351) {
        return {"Very Bad!"};
      }
      else {
        return {"error"};
      }
    
font:
  - file:
      type: gfonts
      family: Roboto
    id: roboto_14
    size: 14

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      it.printf(0, 0, id(roboto_14), "%.1f° F / H: %.1f%%",  id(temperature_f).state, id(humidity).state); 
      it.printf(0, 14, id(roboto_14), "CO2:%.0f / %.0f cm",  id(co2).state, id(ddistance).state); 
      it.printf(0, 30, id(roboto_14), "IAQ: %.0f   %s" ,  id(iaq).state, id(quality).state.c_str());
      it.printf(0, 48, id(roboto_14), "%s",  id(accuracy).state.c_str());  

external_components:
  - source: github://luar123/zigbee_esphome
    components: [zigbee]

globals:
  - id: color_x
    type: float
    restore_value: no
    initial_value: '0'
  - id: color_y
    type: float
    restore_value: no
    initial_value: '0'

zigbee:
  id: "zb"
  router: false
  endpoints:
    - device_type: SIMPLE_SENSOR
      num: 1
      clusters:
        - id: OCCUPANCY_SENSING
          attributes:
            - id: zb_occupancy 
              attribute_id: 0x0000
              type: MAP8
              device: target
              report: true
            - attribute_id: 0x0001
              type: ENUM8
              report: false
              value: 0x02            
    - device_type: SIMPLE_SENSOR
      num: 2
      clusters:
        - id: TEMPERATURE_MEASUREMENT
          attributes:
            - attribute_id: 0x0
              type: UINT16
              report: true
              value: 100
              device: temp2
              scale: 100
        - id:  CARBON_DIOXIDE_MEASUREMENT
          attributes:
            - attribute_id: 0x0000
              type: SINGLE
              report: true
              device: co2
              scale: 0.000001
            - attribute_id: 0x0001
              type: SINGLE
              value: 0.0
            - attribute_id: 0x0002
              type: SINGLE
              value: 0.01
        - id:  ANALOG_INPUT
          attributes:
            - attribute_id: 0x001C
              type: STRING
              max_length: 11
              report: false
              value: Target Dist
            - attribute_id: 0x0051
              type: bool
              value: false
            - attribute_id: 0x0055
              type: single
              report: true
              value: 0
              device: ddistance
            - attribute_id: 0x0075
              type: ENUM16
              value: 118 
              report: false
            - attribute_id: 0x006F
              type: MAP8
              value: 0
              
    - num: 3
      device_type: COLOR_DIMMABLE_LIGHT
      clusters:
        - id: ON_OFF
          attributes:
            - attribute_id: 0
              type: bool
              on_value:
                then:
                  - light.control:
                      id: led_1
                      state: !lambda "return (bool)x;"
        - id: LEVEL
          attributes:
            - attribute_id: 0
              type: UINT8
              on_value:
                then:
                  - light.control:
                      id: led_1
                      brightness: !lambda "return ((float)x)/255;"    
        - id: COLOR_CONTROL
          attributes:
            - attribute_id: 3
              type: UINT16
              on_value:
                then:
                  - lambda: id(color_x) = (float)x/65536;
                  - light.control:
                      id: led_1
                      red: !lambda "return zigbee::get_r_from_xy(id(color_x), id(color_y));"
                      green: !lambda "return zigbee::get_g_from_xy(id(color_x), id(color_y));"
                      blue: !lambda "return zigbee::get_b_from_xy(id(color_x), id(color_y));"
            - attribute_id: 4
              type: UINT16
              on_value:
                then:
                  - lambda: id(color_y) = (float)x/65536;
                  - light.control:
                      id: led_1
                      red: !lambda "return zigbee::get_r_from_xy(id(color_x), id(color_y));"
                      green: !lambda "return zigbee::get_g_from_xy(id(color_x), id(color_y));"
                      blue: !lambda "return zigbee::get_b_from_xy(id(color_x), id(color_y));"
    - device_type: SIMPLE_SENSOR
      num: 4
      clusters:
        - id:  ANALOG_INPUT
          attributes:
            - attribute_id: 0x001C
              type: STRING
              max_length: 3
              report: false
              value: IAQ
            - attribute_id: 0x0051
              type: bool
              value: false
            - attribute_id: 0x0055
              type: single
              device: iaq
              value: 100
              report: true
            - attribute_id: 0x0075
              type: ENUM16
              value: 95 # == count
              report: false
            - attribute_id: 0x006F
              type: MAP8
              value: 0
        - id: BINARY_INPUT
          attributes: 
            - attribute_id: 0x001C
              type: STRING
              max_length: 6
              report: false
              value: Motion
            - attribute_id: 0x0051
              type: bool
              value: true
            - attribute_id: 0x0055
              type: bool
              device: motion
              report: true   
    - device_type: SIMPLE_SENSOR
      num: 5
      clusters:
        - id: REL_HUMIDITY_MEASUREMENT
          attributes:
            - attribute_id: 0
              device: humidity
              type: UINT16
              report: true
              value: 100
              scale: 100
        - id: TEMPERATURE_MEASUREMENT
          attributes:
            - attribute_id: 0x0
              type: UINT16
              report: true
              value: 100
              device: temperature
              scale: 100
        - id: PRESSURE_MEASUREMENT
          attributes:
            - attribute_id: 0x0
              type: UINT16
              report: true
              value: 0x8000
              device: pressure
        - id:  ANALOG_INPUT
          attributes:
            - attribute_id: 0x001C
              type: STRING
              max_length: 14
              report: false
              value: Gas Resistance
            - attribute_id: 0x0051
              type: bool
              value: false
            - attribute_id: 0x0055
              type: single
              device: gasresist
              value: 100
              report: true
            - attribute_id: 0x0075
              type: ENUM16
              value: 4 # == ohm
              report: false
            - attribute_id: 0x006F
              type: MAP8
              value: 0
        - id: BINARY_INPUT
          attributes: 
            - attribute_id: 0x001C
              type: STRING
              max_length: 12
              report: false
              value: Still Target
            - attribute_id: 0x0051
              type: bool
              value: false
            - attribute_id: 0x0055
              type: bool
              device: starget
              report: true
              
    - num: 6
      device_type: ON_OFF_OUTPUT
      clusters:
        - id: ON_OFF
          attributes:
            - attribute_id: 0x001C
              type: STRING
              max_length: 5
              report: false
              value: EMODE
            - attribute_id: 0
              type: bool
              on_value:
                then:
                  - if:
                      condition:
                        lambda: 'return !x;'
                      then:
                        - switch.turn_off: emode
                      else:
                        - switch.turn_on: emode
    - num: 7
      device_type: ON_OFF_OUTPUT
      clusters:
        - id: ON_OFF
          attributes:
            - attribute_id: 0x001C
              type: STRING
              max_length: 5
              report: false
              value: BMODE
            - attribute_id: 0
              type: bool
              on_value:
                then:
                  - if:
                      condition:
                        lambda: 'return !x;'
                      then:
                        - switch.turn_off: bmode
                      else:
                        - switch.turn_on: bmode
    - device_type: SIMPLE_SENSOR
      num: 8
      clusters:
        - id: ILLUMINANCE_MEASUREMENT
          attributes:
            - attribute_id: 0
              type: UINT16
              report: true
              value: 0
              device: ldlux
              lambda: !lambda "return log10(x)*10000 + 1;"
        - id:  ANALOG_INPUT
          attributes:
            - attribute_id: 0x001C
              type: STRING
              max_length: 8
              report: false
              value: Accuracy
            - attribute_id: 0x0051
              type: bool
              value: false
            - attribute_id: 0x0055
              type: single
              value: 100
              device: iaqa
              report: true
            - attribute_id: 0x0075
              type: ENUM16
              value: 95
              report: false
            - attribute_id: 0x006F
              type: MAP8
              value: 0     
        - id: BINARY_INPUT
          attributes: 
            - attribute_id: 0x001C
              type: STRING
              max_length: 6
              report: false
              value: Target
            - attribute_id: 0x0051
              type: bool
              value: true
            - attribute_id: 0x0055
              type: bool
              device: target
              report: true
